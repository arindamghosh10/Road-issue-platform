# Local development stack. Everything here is free / open source.
#   docker compose up -d --build
#   docker compose exec api python -m app.seed
# See README.md for details.

services:
  # Core database: tickets, reports, jurisdictions. PostGIS for spatial queries.
  core-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: roadwatch_core
      POSTGRES_USER: roadwatch_core
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core_dev_pw}
    ports: ["5432:5432"]
    volumes: [core-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadwatch_core -d roadwatch_core"]
      interval: 5s
      retries: 20

  # Identity vault: a SEPARATE Postgres server with its own credentials and volume.
  # Only the citizen auth service connects here. Gov tenants never get access.
  vault-db:
    image: postgres:16
    environment:
      POSTGRES_DB: roadwatch_vault
      POSTGRES_USER: roadwatch_vault
      POSTGRES_PASSWORD: ${VAULT_DB_PASSWORD:-vault_dev_pw}
    ports: ["5433:5432"]
    volumes: [vault-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadwatch_vault -d roadwatch_vault"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible object storage for photos (originals and sanitized copies).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: roadwatch
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-roadwatch_dev_pw}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # One-shot: create the two photo buckets. Originals stay private; only sanitized
  # (EXIF-stripped, face/plate-blurred) copies go in the public bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 roadwatch $${S3_SECRET_KEY:-roadwatch_dev_pw} &&
             mc mb --ignore-existing local/photos-original &&
             mc mb --ignore-existing local/photos-public &&
             mc anonymous set download local/photos-public"
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY:-roadwatch_dev_pw}

  # Catches all outgoing email locally. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CORE_DATABASE_URL: postgresql+psycopg://roadwatch_core:${CORE_DB_PASSWORD:-core_dev_pw}@core-db:5432/roadwatch_core
      VAULT_DATABASE_URL: postgresql+psycopg://roadwatch_vault:${VAULT_DB_PASSWORD:-vault_dev_pw}@vault-db:5432/roadwatch_vault
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: roadwatch
      S3_SECRET_KEY: ${S3_SECRET_KEY:-roadwatch_dev_pw}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["8000:8000"]
    depends_on:
      core-db: { condition: service_healthy }
      vault-db: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }

volumes:
  core-db-data:
  vault-db-data:
  minio-data:
