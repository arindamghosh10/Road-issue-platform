# Two independent migration trees, one per database:
#   alembic -n core  upgrade head    # tickets / reports / jurisdictions (PostGIS)
#   alembic -n vault upgrade head    # identity vault
# Database URLs come from app settings (CORE_DATABASE_URL / VAULT_DATABASE_URL).

[core]
script_location = migrations/core

[vault]
script_location = migrations/vault

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
