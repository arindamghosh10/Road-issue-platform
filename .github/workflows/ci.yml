# Runs on every pull request and every push to main.
#   backend  — lint, migrations match the models, full pytest suite (both databases)
#   web      — typecheck, translation tests, production build
#   mobile   — typecheck, unit tests + no-gallery check, Android bundle
#   e2e      — real API + seeded demo data, then the dashboards' and the citizen app's
#              Playwright journeys in Chromium
# The two databases run as separate servers, as in docker-compose.yml, so the vault is
# exercised as a separate database here too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CORE_URL: postgresql+psycopg://roadwatch_core:core_dev_pw@localhost:5432
  VAULT_URL: postgresql+psycopg://roadwatch_vault:vault_dev_pw@localhost:5433

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      core-db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: roadwatch_core_test, POSTGRES_USER: roadwatch_core, POSTGRES_PASSWORD: core_dev_pw }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roadwatch_core" --health-interval 5s --health-retries 20
      vault-db:
        image: postgres:16
        env: { POSTGRES_DB: roadwatch_vault_test, POSTGRES_USER: roadwatch_vault, POSTGRES_PASSWORD: vault_dev_pw }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U roadwatch_vault" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          TEST_CORE_DATABASE_URL: ${{ env.CORE_URL }}/roadwatch_core_test
          TEST_VAULT_DATABASE_URL: ${{ env.VAULT_URL }}/roadwatch_vault_test
        run: pytest -q
      - name: Migrations match the models
        env:
          CORE_DATABASE_URL: ${{ env.CORE_URL }}/roadwatch_core_test
          VAULT_DATABASE_URL: ${{ env.VAULT_URL }}/roadwatch_vault_test
        run: |
          alembic -n core check
          alembic -n vault check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Android bundle (catches imports that only fail on a phone)
        run: npx expo export --platform android --output-dir /tmp/dist-android

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      core-db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: roadwatch_core, POSTGRES_USER: roadwatch_core, POSTGRES_PASSWORD: core_dev_pw }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roadwatch_core" --health-interval 5s --health-retries 20
      vault-db:
        image: postgres:16
        env: { POSTGRES_DB: roadwatch_vault, POSTGRES_USER: roadwatch_vault, POSTGRES_PASSWORD: vault_dev_pw }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U roadwatch_vault" --health-interval 5s --health-retries 20
    env:
      CORE_DATABASE_URL: postgresql+psycopg://roadwatch_core:core_dev_pw@localhost:5432/roadwatch_core
      VAULT_DATABASE_URL: postgresql+psycopg://roadwatch_vault:vault_dev_pw@localhost:5433/roadwatch_vault
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /tmp/objects
      RATE_LIMIT_BACKEND: memory
      TASKS_EAGER: "true"
      VISION_PROVIDER: stub
      EMAIL_BACKEND: log
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8081"]'
      API_LOG: /tmp/api.log
      FAKE_CAMERA: /tmp/fake-camera.mjpeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API with sample areas and demo tickets
        working-directory: backend
        run: |
          pip install -e .
          alembic -n core upgrade head
          alembic -n vault upgrade head
          python -m app.seed
          python -m app.seed.demo --tickets 40
          python -m app.seed.photos "$FAKE_CAMERA"
          nohup uvicorn app.main:app --port 8000 > "$API_LOG" 2>&1 &
      - name: Dashboards
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm start > /tmp/web.log 2>&1 &
      - name: Citizen app (web build)
        working-directory: mobile
        run: |
          npm ci
          npx expo export --platform web --output-dir /tmp/dist-web
          nohup node scripts/serve-spa.mjs /tmp/dist-web 8081 > /tmp/spa.log 2>&1 &
      - name: Browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Wait for servers
        run: |
          for url in http://localhost:8000/api/v1/public/categories http://localhost:3000 http://localhost:8081/login; do
            for i in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 2; done
            curl -sf -o /dev/null "$url" || { echo "not up: $url"; exit 1; }
          done
      - name: Dashboards journey
        working-directory: web
        run: npx playwright test
      - name: Citizen app journey
        working-directory: mobile
        run: npx playwright install chromium && npx playwright test
      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log /tmp/spa.log
